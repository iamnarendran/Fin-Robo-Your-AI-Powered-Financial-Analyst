name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next generates route types (LayoutProps, PageProps) before tsc can see them.
      - run: npm run typecheck
      - run: npm test
      # Mock mode: no network or API keys needed in CI.
      - run: npm run build
        env:
          FINROBO_MOCK: "1"
